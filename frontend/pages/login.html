<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in | Giriraj Resort</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script defer src="/assets/app.js"></script>
  </head>
  <body>
    <header class="nav">
      <a class="brand" href="/"
        ><img src="/assets/giriraj-logo.svg" alt="Giriraj Resort logo"
      /></a>
      <nav><a href="/rooms">Rooms</a><a href="/contact">Contact</a></nav>
    </header>
    <main class="login-wrap">
      <form class="login form" onsubmit="submitLogin(event)">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Sign in</h1>
        <label>EMAIL ADDRESS<input required name="email" type="email" /></label
        ><label
          >PASSWORD<input
            required
            name="password"
            type="password"
            minlength="6" /></label
        ><button class="button">Sign in →</button>
        <p id="login-message"></p>
      </form>
      <form class="login form" onsubmit="submitRegister(event)">
        <p class="eyebrow">FIRST VISIT?</p>
        <h2>Create your guest account</h2>
        <label>FULL NAME<input required name="fullName" /></label
        ><label>EMAIL ADDRESS<input required name="email" type="email" /></label
        ><label
          >PASSWORD<input
            required
            name="password"
            type="password"
            minlength="6" /></label
        ><button class="button">Create account →</button>
        <p id="register-message"></p>
      </form>
    </main>
    <footer><span>© 2026 Giriraj Resort</span></footer>
  </body>
</html>
